name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Base URL of the chatbot's AI worker (status-worker). A repository
          # *variable*, not a secret: it ends up in the public bundle. Unset
          # means the chatbot only uses its built-in answers.
          VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
          # Cloudflare Web Analytics beacon token (cookieless). Also a public
          # repository variable; unset means no statistics are collected.
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          # Tags Sentry error reports with the deployed commit.
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Uploads source maps to Sentry (readable stack traces). A secret; unset
          # means no source maps, everything else works the same.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
