name: Test

# Every push to develop: smoke tests (desktop + mobile, incl. accessibility) and
# the responsive check. Merges to main and the deploy itself don't run them;
# develop is where problems should be caught.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Playwright builds the site itself (playwright.config.ts); CI=1 is set by GitHub.
      - name: Smoke tests
        run: npm test

      - name: Responsive check
        run: npm run test:responsive

      # Screenshots of every page at every breakpoint, plus traces of failures.
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
