<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are all
         managed centrally in src/App.vue (via unhead) so that the prerendered
         HTML and the running SPA can never disagree. -->
    <title>Robbe Saelens - Full-Stack Web Developer</title>

    <!-- Browser UI colour = page background. Defaults follow the OS; the theme
         script below overrides both with the site's own light/dark choice. -->
    <meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#222222" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />


    <script>
      // Apply theme before first paint to prevent flash
      ;(function () {
        try {
          const theme = localStorage.getItem('theme')
          const dark =
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          // The site theme can differ from the OS one, so both tags get the
          // colour of the theme actually shown.
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', dark ? '#222222' : '#f6f6f6')
          })
        } catch (e) {}
      })()
    </script>

    <script>
      // Intro animation: decided before first paint so it never flashes.
      // Plays only on the homepage, once per session, never for reduced
      // motion or crawlers. `js` gates the hero's hidden start state, so the
      // page stays fully visible without JavaScript.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        var play = false
        try {
          var path = location.pathname
          play =
            (path === '/' || path === '/index.html') &&
            !sessionStorage.getItem('intro-seen') &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
            !/bot|crawl|spider|slurp|lighthouse|headlesschrome/i.test(navigator.userAgent)
          if (play) sessionStorage.setItem('intro-seen', '1')
        } catch (e) {}
        if (!play) {
          root.classList.add('intro-done')
          return
        }
        root.classList.add('intro-play')
        window.__introTimer = setTimeout(function () {
          root.classList.add('intro-done')
        }, 1700)
      })()
    </script>
    <style>
      #intro {
        display: none;
      }
      html.intro-play #intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f6f6f6;
        color: #134e4a;
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', ui-monospace, monospace;
        transition:
          opacity 0.5s ease,
          transform 0.6s cubic-bezier(0.7, 0, 0.3, 1),
          visibility 0s linear 0.6s;
      }
      html.dark.intro-play #intro {
        background: #222222;
        color: #e2e8f0;
      }
      html.intro-play.intro-done #intro {
        opacity: 0;
        transform: translateY(-3%);
        visibility: hidden;
        pointer-events: none;
      }
      .intro-box {
        width: min(22rem, 100%);
      }
      .intro-mark {
        display: block;
        height: 2.25rem;
        width: auto;
        margin-bottom: 1.5rem;
        animation: intro-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .intro-mark .i {
        fill: currentColor;
      }
      /* The full stop doubles as a cursor while the intro runs. */
      .intro-mark .d {
        fill: #0d9488;
        animation: intro-blink 0.9s steps(1) 0.6s infinite;
      }
      html.dark .intro-mark .d {
        fill: #2dd4bf;
      }
      .intro-line {
        margin: 0 0 0.45rem;
        font-size: 0.85rem;
        line-height: 1.5;
        white-space: nowrap;
        overflow: hidden;
        opacity: 0;
        animation: intro-line 0.35s ease forwards;
      }
      .intro-line:nth-of-type(1) {
        animation-delay: 0.15s;
      }
      .intro-line:nth-of-type(2) {
        animation-delay: 0.5s;
      }
      .intro-line:nth-of-type(3) {
        animation-delay: 0.85s;
        white-space: normal;
        opacity: 0;
      }
      .intro-prompt,
      .intro-ok {
        color: #0d9488;
        font-weight: 700;
      }
      html.dark .intro-prompt,
      html.dark .intro-ok {
        color: #2dd4bf;
      }
      .intro-muted {
        opacity: 0.6;
      }
      .intro-bar {
        height: 2px;
        margin-top: 1.25rem;
        border-radius: 2px;
        background: rgba(13, 148, 136, 0.15);
        overflow: hidden;
      }
      .intro-bar span {
        display: block;
        height: 100%;
        background: #0d9488;
        transform-origin: left;
        animation: intro-bar 1.45s cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      html.dark .intro-bar span {
        background: #2dd4bf;
      }
      @media (min-width: 768px) {
        .intro-box {
          width: 26rem;
        }
        .intro-mark {
          height: 2.5rem;
          margin-bottom: 1.75rem;
        }
        .intro-line {
          font-size: 1rem;
          margin-bottom: 0.55rem;
        }
        .intro-bar {
          height: 3px;
          margin-top: 1.5rem;
        }
      }
      @keyframes intro-pop {
        from {
          opacity: 0;
          transform: scale(0.6) rotate(-8deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes intro-blink {
        50% {
          opacity: 0;
        }
      }
      @keyframes intro-line {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes intro-bar {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
    </style>

    <!-- Google Analytics loads only after cookie consent: src/analytics.ts -->
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-box">
        <svg class="intro-mark" viewBox="0 0 10.22 5.26" width="70" height="36">
          <path class="i" d="M0.01 5.11L0.01 0.15L1.25 0.15L1.25 0.71L1.43 0.71C1.5 0.51 1.63 0.36 1.79 0.27C1.97 0.18 2.16 0.13 2.39 0.13L2.99 0.13L2.99 1.25L2.37 1.25C2.05 1.25 1.79 1.34 1.58 1.51C1.37 1.68 1.27 1.94 1.27 2.29L1.27 5.11L0.01 5.11ZM5.59 5.25C4.94 5.25 4.41 5.11 4 4.83C3.59 4.55 3.34 4.15 3.25 3.63L4.41 3.33C4.46 3.56 4.54 3.75 4.65 3.88C4.75 4.01 4.89 4.11 5.05 4.17C5.22 4.22 5.4 4.25 5.59 4.25C5.88 4.25 6.1 4.2 6.24 4.1C6.38 3.99 6.45 3.86 6.45 3.71C6.45 3.56 6.38 3.44 6.25 3.36C6.12 3.27 5.9 3.2 5.61 3.15L5.33 3.1C4.98 3.03 4.67 2.94 4.38 2.83C4.09 2.71 3.86 2.55 3.69 2.34C3.52 2.13 3.43 1.87 3.43 1.54C3.43 1.05 3.61 0.67 3.97 0.41C4.33 0.14 4.8 0.01 5.39 0.01C5.94 0.01 6.4 0.13 6.77 0.38C7.14 0.63 7.38 0.95 7.49 1.35L6.32 1.71C6.27 1.46 6.16 1.28 6 1.17C5.83 1.06 5.63 1.01 5.39 1.01C5.15 1.01 4.97 1.05 4.84 1.14C4.71 1.22 4.65 1.33 4.65 1.48C4.65 1.64 4.72 1.76 4.85 1.84C4.98 1.91 5.16 1.97 5.39 2.01L5.67 2.06C6.04 2.13 6.38 2.22 6.69 2.33C6.99 2.44 7.23 2.59 7.41 2.8C7.58 3 7.67 3.27 7.67 3.62C7.67 4.14 7.48 4.54 7.11 4.83C6.73 5.11 6.22 5.25 5.59 5.25Z" />
          <rect class="d" x="8.38" y="3.27" width="1.84" height="1.84" rx="0.3" />
        </svg>
        <p class="intro-line"><span class="intro-prompt">$</span> boot robbe-saelens</p>
        <p class="intro-line"><span class="intro-ok">&#10003;</span> <span id="intro-step">loading projects</span></p>
        <p class="intro-line intro-muted" id="intro-slogan"></p>
        <div class="intro-bar"><span></span></div>
      </div>
    </div>
    <script>
      ;(function () {
        var root = document.documentElement
        if (!root.classList.contains('intro-play') || root.classList.contains('intro-done')) return
        var nl = false
        try {
          var saved = localStorage.getItem('app-locale')
          nl = saved ? saved === 'nl' : /^nl\b/i.test(navigator.language)
        } catch (e) {}
        var slogans = nl
          ? [
              'Briljantie laden, één regel code tegelijk.',
              'De magie van code, speciaal voor jou.',
              'Gordel om, code in uitvoering.',
              'Codedelicatessen in de maak.',
              'Achter elke pixel zit een developer.',
              'Pure codevreugde wordt geïnjecteerd.',
            ]
          : [
              'Loading brilliance, one line of code at a time.',
              'Unleashing the magic of code, just for you.',
              'Buckle up, code in progress.',
              'Cooking up code delicacies.',
              "Behind every pixel, there's a coder's touch.",
              'Injecting pure code joy into your experience.',
            ]
        document.getElementById('intro-slogan').textContent =
          slogans[Math.floor(Math.random() * slogans.length)]
        if (nl) document.getElementById('intro-step').textContent = 'projecten laden'
        // Any click, tap or key skips the intro.
        var skip = function () {
          clearTimeout(window.__introTimer)
          root.classList.add('intro-done')
          removeEventListener('pointerdown', skip)
          removeEventListener('keydown', skip)
        }
        addEventListener('pointerdown', skip)
        addEventListener('keydown', skip)
      })()
    </script>
    <div id="app"><!--app-html--></div>

    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <p><strong>Robbe Saelens — Full-Stack Web Developer</strong></p>
        <p>
          Full-stack web developer from Geluwe, Belgium, building with Vue, TypeScript, React,
          Laravel and Next.js.
        </p>
        <ul style="list-style: none; padding: 0">
          <li><a href="/projects">Projects</a></li>
          <li><a href="/contact">About &amp; contact</a></li>
          <li><a href="https://github.com/RobbeSaelens">GitHub</a></li>
          <li><a href="https://linkedin.com/in/robbe-saelens-1a14511b8">LinkedIn</a></li>
        </ul>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
