<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are all
         managed centrally in src/App.vue (via unhead) so that the prerendered
         HTML and the running SPA can never disagree. -->
    <title>Robbe Saelens - Full-Stack Web Developer</title>

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" href="/Fav.png" />
    <link rel="apple-touch-icon" href="/Fav.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />

    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />

    <script>
      // Apply theme before first paint to prevent flash
      ;(function () {
        try {
          const theme = localStorage.getItem('theme')
          if (
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KTMQFBG1N2"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-KTMQFBG1N2')
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>

    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>Robbe Saelens — Full-Stack Web Developer</h1>
        <p>
          Full-stack web developer from Geluwe, Belgium, building with Vue, TypeScript, React,
          Laravel and Next.js.
        </p>
        <ul style="list-style: none; padding: 0">
          <li><a href="/projects">Projects</a></li>
          <li><a href="/contact">About &amp; contact</a></li>
          <li><a href="https://github.com/RobbeSaelens">GitHub</a></li>
          <li><a href="https://linkedin.com/in/robbe-saelens-1a14511b8">LinkedIn</a></li>
        </ul>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
